[tool.poetry]
name = "fraud-challenge"
version = "0.1.0"
description = "Clasificacion binaria de fraude - Mercado Libre Data Scientist Technical Challenge 2026"
authors = ["Jeison Alarcon <jeison.alarcon@mercadolibre.com.co>"]
readme = "README.md"
packages = [
    { include = "config.py", from = "src" },
    { include = "compat.py", from = "src" },
    { include = "data", from = "src" },
    { include = "features", from = "src" },
    { include = "models", from = "src" },
    { include = "training", from = "src" },
    { include = "evaluation", from = "src" },
    { include = "serving", from = "src" },
    { include = "promotion", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
numpy = ">=1.26,<2.0"
pandas = ">=2.1,<3.0"
pyarrow = ">=15.0,<16.0"
scikit-learn = ">=1.4,<1.5"
category-encoders = ">=2.6,<3.0"
catboost = ">=1.2,<2.0"
torch = ">=2.2,<3.0"
onnx = ">=1.15,<2.0"
onnxruntime = ">=1.17,<2.0"
skl2onnx = ">=1.16,<2.0"
pydantic = ">=2.6,<3.0"
pyyaml = ">=6.0,<7.0"
matplotlib = ">=3.8,<4.0"
joblib = ">=1.3,<2.0"
scipy = ">=1.12,<1.13"
tqdm = ">=4.66,<5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.9"
pre-commit = "^3.7"
nbstripout = "^0.7"
ipykernel = "^6.29"

[tool.poetry.scripts]
fraud-promote-winner = "promotion.cli:main"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
